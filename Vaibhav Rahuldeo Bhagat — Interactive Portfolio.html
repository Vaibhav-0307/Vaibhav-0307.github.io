<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaibhav Rahuldeo Bhagat — Interactive Portfolio</title>
<style>
  /* ===== EDIT COLORS HERE ===== */
  :root { --bg:#fff; --fg:#000; --muted:#6b6b6b; --line:#000; color-scheme: light;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#000; --fg:#fff; --muted:#9a9a9a; --line:#fff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg:#000; --fg:#fff; --muted:#9a9a9a; --line:#fff; color-scheme: dark; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }

  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--fg); overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace; }
  #bg { position:fixed; inset:0; width:100%; height:100%; }
  .stage { position:relative; height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .term { width:100%; max-width:680px; height:min(620px,100%); display:flex; flex-direction:column;
    background:var(--bg); border:1px solid var(--line); }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:.8rem; }
  .bar i { width:10px; height:10px; border:1px solid var(--line); border-radius:50%; display:block; }
  .bar span { margin-left:auto; color:var(--muted); }
  .bar button { margin-left:10px; }
  #out { flex:1; overflow-y:auto; padding:16px 14px; font-size:.92rem; line-height:1.65; }
  #out p { white-space:pre-wrap; word-break:break-word; }
  .m { color:var(--muted); }
  .h { font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  button { font:inherit; font-size:.8rem; background:var(--bg); color:var(--fg); border:1px solid var(--line); padding:4px 12px; cursor:pointer; }
  button:hover, button:focus-visible { background:var(--fg); color:var(--bg); outline:none; }
  form { display:flex; gap:8px; align-items:center; padding:12px 14px; border-top:1px solid var(--line); }
  form label { white-space:nowrap; font-size:.85rem; }
  #in { flex:1; min-width:0; background:transparent; border:0; outline:0; color:var(--fg); font:inherit; font-size:16px; caret-color:var(--fg); }
  @media (max-width:480px) { .stage { padding:8px; } form label { display:none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="stage">
  <div class="term" role="application" aria-label="Interactive portfolio terminal">
    <div class="bar"><i></i><i></i><i></i><span>vaibhav — portfolio</span><button id="theme" type="button">theme</button></div>
    <div id="out" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="f" autocomplete="off">
      <label for="in">visitor@vaibhav:~$</label>
      <input id="in" type="text" spellcheck="false" autocapitalize="off" aria-label="Type a command">
    </form>
  </div>
</div>

<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
const NAME = "Vaibhav Rahuldeo Bhagat";
const SKILLS = ["C", "C++", "Java", "HTML & CSS", "Python", "SQL"];
const PROJECTS = [];               // add: { name:"…", desc:"…", link:"https://…" }
const EMAIL = "";                  // add your email here, e.g. "you@example.com"

const out = document.getElementById("out"), input = document.getElementById("in");
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function print(text, cls) {
  const p = document.createElement("p"); p.textContent = text; if (cls) p.className = cls;
  out.appendChild(p); out.scrollTop = out.scrollHeight;
}

const cmds = {
  help: () => { print("Available commands:", "h");
    ["about", "skills", "skill <name>", "projects", "contact", "theme", "clear"].forEach(c => print("  " + c)); },
  about: () => { print(NAME, "h");
    print("3rd-year CSE student at BIT Ballarpur.");
    print("Main goal: learning."); },
  whoami: () => cmds.about(),
  skills: () => { print("Skills (click a name in the background, or type: skill c)", "h");
    SKILLS.forEach(s => print("  › " + s)); print("Still learning.", "m"); },
  projects: () => { print("Projects", "h");
    if (!PROJECTS.length) return print("None yet. This section will grow as I build things.", "m");
    PROJECTS.forEach(p => print("  › " + p.name + " — " + p.desc + (p.link ? " (" + p.link + ")" : ""))); },
  contact: () => { print("Contact", "h");
    print(EMAIL ? "  Email: " + EMAIL : "Contact details coming soon.", EMAIL ? "" : "m"); },
  theme: () => { const dark = isDark(); root.dataset.theme = dark ? "light" : "dark"; print("Theme: " + (dark ? "light" : "dark"), "m"); },
  clear: () => { out.innerHTML = ""; }
};
function isDark() { return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }

const hist = []; let hi = 0;
function run(raw) {
  const line = raw.trim(); if (!line) return;
  hist.push(line); hi = hist.length;
  print("$ " + line, "m");
  const [c, ...rest] = line.toLowerCase().split(/\s+/);
  if (c === "skill") {
    const q = rest.join(" "), s = SKILLS.find(x => x.toLowerCase() === q);
    return s ? print(s + " — part of my skill set. Still learning.") : print("Unknown skill. Try: skills", "m");
  }
  if (cmds[c]) cmds[c](); else print("Command not found: " + c + ". Type help.", "m");
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); run(input.value); input.value = ""; });
input.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && hist.length) { hi = Math.max(0, hi - 1); input.value = hist[hi]; e.preventDefault(); }
  if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ""; e.preventDefault(); }
  if (e.key === "Tab") { e.preventDefault(); const m = Object.keys(cmds).find(k => k.startsWith(input.value.toLowerCase())); if (m && input.value) input.value = m; }
});
document.getElementById("theme").addEventListener("click", () => cmds.theme());
const chips = document.getElementById("chips");
["about", "skills", "projects", "contact", "help", "clear"].forEach(c => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = c;
  b.addEventListener("click", () => run(c)); chips.appendChild(b);
});

/* Boot message */
print("Hi, I’m " + NAME + ".", "h");
print("This is an interactive portfolio. Type a command or tap a button below.", "m");
print("Try: about · skills · projects · contact", "m");

/* ===== Background: drifting skill nodes that react to the pointer ===== */
const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
let W, H, dpr, nodes = [], mouse = { x: -999, y: -999 };
function size() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function init() {
  size();
  nodes = SKILLS.map(s => ({ s, x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5 }));
}
function draw() {
  const css = getComputedStyle(root), fg = css.getPropertyValue("--fg").trim();
  ctx.clearRect(0, 0, W, H); ctx.textAlign = "center"; ctx.fillStyle = fg; ctx.strokeStyle = fg;
  nodes.forEach(n => {
    if (!reduce) { n.x += n.vx; n.y += n.vy; if (n.x < 30 || n.x > W - 30) n.vx *= -1; if (n.y < 30 || n.y > H - 30) n.vy *= -1; }
    const d = Math.hypot(n.x - mouse.x, n.y - mouse.y), near = d < 120;
    ctx.globalAlpha = near ? 1 : .35; ctx.font = (near ? 22 : 16) + "px ui-monospace, Menlo, Consolas, monospace";
    ctx.fillText(n.s, n.x, n.y);
    if (near) { ctx.globalAlpha = .4; ctx.beginPath(); ctx.moveTo(n.x, n.y + 6); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
  });
  ctx.globalAlpha = 1;
  if (!reduce) requestAnimationFrame(draw);
}
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; if (reduce) draw(); });
addEventListener("pointerdown", e => {
  if (e.target.closest(".term")) return;
  const n = nodes.find(n => Math.hypot(n.x - e.clientX, n.y - e.clientY) < 40);
  if (n) run("skill " + n.s);
});
addEventListener("resize", init);
init(); draw();
</script>
</body>
</html>
